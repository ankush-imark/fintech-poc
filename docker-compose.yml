services:

  mysql:
    image: mysql:8.4
    container_name: fintech-mysql
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}

    ports:
      - "3306:3306"

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-p${MYSQL_ROOT_PASSWORD}"
        ]
      interval: 5s
      timeout: 5s
      retries: 20


  redis:
    image: redis:7-alpine
    container_name: fintech-redis
    restart: unless-stopped

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

    command: redis-server --appendonly yes

    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "ping"
        ]
      interval: 5s
      timeout: 3s
      retries: 10


  api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: fintech-api
    restart: unless-stopped

    env_file:
      - .env

    ports:
      - "3000:3000"
    
    volumes:
      - .:/app
      - /app/node_modules

    depends_on:
      mysql:
        condition: service_healthy

      redis:
        condition: service_healthy

    command: npm start


  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker

    container_name: fintech-worker
    restart: unless-stopped

    env_file:
      - .env

    volumes:
      - .:/app
      - /app/node_modules

    depends_on:
      mysql:
        condition: service_healthy

      redis:
        condition: service_healthy

    command: npm run worker


volumes:
  mysql_data:
  redis_data: